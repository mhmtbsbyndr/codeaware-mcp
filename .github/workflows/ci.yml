name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  rust:
    name: Rust build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Clippy warnings are reported but not fatal until the existing warnings are fixed.
      # Switch to `-- -D warnings` once `cargo clippy --all-targets --locked` is clean.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --all --locked

      - name: Release build
        run: cargo build --release --locked

  shell:
    name: Shell script lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh
